<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Darren's Big Week</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Darren's Big Week">
  <meta name="theme-color" content="#0b1f44">
  <meta name="description" content="Darren's Big Week - a one-level platformer celebrating the Week 7 champion.">
  <!-- link preview when the score is texted (iMessage / Android Messages) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Darren's Big Week">
  <meta property="og:title" content="Darren's Big Week">
  <meta property="og:description" content="Week 7 Champion Edition. Beat the game, then beat my score.">
  <meta property="og:url" content="https://darrens-big-week.vercel.app/">
  <meta property="og:image" content="https://darrens-big-week.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="controls" aria-hidden="true">
      <div class="pad pad-left">
        <button class="btn btn-dir" id="btn-left" data-action="left"><span>&#9664;</span></button>
        <button class="btn btn-dir" id="btn-right" data-action="right"><span>&#9654;</span></button>
      </div>
      <div class="pad pad-right">
        <button class="btn btn-throw" id="btn-throw" data-action="throw"><span>THROW</span></button>
        <button class="btn btn-jump" id="btn-jump" data-action="jump"><span>JUMP</span></button>
      </div>
    </div>
  </div>
  <script src="vendor/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
